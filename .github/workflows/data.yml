name: Update data

on:
  schedule:
    - cron: "3 0 * * *"    # сразу после обновления магазина (00:00 utc = 03:00 мск)
    - cron: "15 0 * * *"   # запасные заходы, если магазин задержался
    - cron: "40 0 * * *"
    - cron: "30 2 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      # уже скачанные иконки каталога храним в кэше, чтобы не качать тысячи файлов каждый день
      - uses: actions/cache/restore@v4
        with:
          path: site/img/c3
          key: icons3-${{ github.run_id }}
          restore-keys: icons3-
      - name: Build data
        run: |
          python -u build_data.py
          cp index.html site/
          du -sh site
      # кэш иконок сохраняем всегда, даже если сборка упала — чтобы в следующий раз не качать заново
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: site/img/c3
          key: icons3-${{ github.run_id }}
      # configure-pages для деплоя не обязателен: если у гитхаба сбой (как 27.11 — Server Error), не валим сборку
      - uses: actions/configure-pages@v5
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment2.outputs.page_url }}
    steps:
      # гитхаб иногда отвечает ошибкой на деплой — пробуем ещё раз через минуту
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deployment.outcome == 'failure'
        run: sleep 60
      - id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
