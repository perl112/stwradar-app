name: Update data

on:
  schedule:
    - cron: "3 0 * * *"    # сразу после обновления магазина (00:00 utc = 03:00 мск)
    - cron: "15 0 * * *"   # запасные заходы, если магазин задержался
    - cron: "40 0 * * *"
    - cron: "30 2 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      # уже скачанные иконки каталога храним в кэше, чтобы не качать тысячи файлов каждый день
      - uses: actions/cache@v4
        with:
          path: site/img/c2
          key: icons2-${{ github.run_id }}
          restore-keys: icons2-
      - name: Build data
        run: |
          python build_data.py
          cp index.html site/
          du -sh site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
