<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Storm Radar · Магазин</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: игровая витрина, спокойная зимняя ночь, как картинки канала
   IDEA: прилавок магазина фортнайта внутри радара
   PICTURE: сетка карточек предметов — сама витрина и есть картинка
   COLOUR/TYPE: тёмно-синяя ночь, ледяной голубой акцент, Manrope
   LAYOUT: шапка → поиск → фильтры → сетка, снизу шторка предмета */
:root{--bg:#0d1b2e;--bg2:#13263d;--card:#10233a;--line:#24425f;--ink:#eef6ff;--mut:#93aecb;--acc:#8cd7ff;--gold:#ffcd5a;--new:#78ebaa}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Manrope,system-ui,sans-serif;overflow-x:clip}
body{background:radial-gradient(120% 60% at 50% -10%,#1f4a63 0,transparent 60%),linear-gradient(#0d1b2e,#16304b);min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
header{padding:calc(18px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#bfe9ff,#2f6f98 60%,#163450);display:grid;place-items:center;box-shadow:0 0 18px #7fd0ff55;flex:none}
.logo svg{width:20px}
h1{font-size:21px;line-height:1.1;margin:0;font-weight:800}
.sub{color:var(--mut);font-size:13px}
.tabs{display:flex;gap:6px;margin-left:auto}
.tab{border:1px solid var(--line);background:var(--bg2);color:var(--mut);border-radius:20px;padding:8px 12px;font:700 13px Manrope,sans-serif;cursor:pointer;min-height:38px}
.tab.on{background:var(--acc);color:#08263c;border-color:var(--acc)}
.bar{position:sticky;top:0;z-index:5;background:linear-gradient(#0d1b2ef2,#0d1b2ee0);backdrop-filter:blur(8px);padding:8px 16px 10px}
.search{width:100%;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--bg2);color:var(--ink);font:16px Manrope,sans-serif;padding:0 14px}
.search:focus{outline:2px solid var(--acc);outline-offset:1px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-top:9px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:transparent;color:var(--mut);border-radius:18px;padding:7px 12px;font:700 13px Manrope,sans-serif;cursor:pointer;min-height:36px}
.chip.on{background:#1d3d5c;color:var(--ink);border-color:#3d6f99}
.chip b{color:var(--acc);font-weight:800;margin-left:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:6px 16px 24px}
.it{position:relative;border-radius:16px;overflow:hidden;background:var(--card);border:1.5px solid var(--b,#3b5f80);box-shadow:0 0 16px var(--g,#0000);cursor:pointer;text-align:left;padding:0;color:inherit;font:inherit;transition:transform .15s}
.it:active{transform:scale(.97)}
.art{aspect-ratio:1/1.05;position:relative;background:linear-gradient(var(--c1),var(--c2))}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:bottom}
.art::after{content:"";position:absolute;inset:auto 0 0;height:45%;background:linear-gradient(transparent,#08101cdd)}
.nm{position:absolute;left:9px;right:9px;bottom:7px;z-index:1;font-weight:800;font-size:14px;line-height:1.15;text-shadow:0 1px 2px #000;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bd{position:absolute;top:7px;left:7px;z-index:1;border-radius:10px;padding:2px 8px;font-size:11.5px;font-weight:800}
.bd.n{background:var(--new);color:#0b3a20}.bd.r{background:#97dcff;color:#08304b}.bd.y{background:var(--gold);color:#3a2600}
.bell{position:absolute;top:6px;right:7px;z-index:1;font-size:15px;filter:drop-shadow(0 1px 2px #000)}
.info{display:flex;align-items:center;gap:6px;padding:8px 9px;border-top:2px solid var(--b,#3b5f80)}
.vb{width:17px;height:17px;flex:none}
.pr{font-weight:800}
.old{color:var(--mut);text-decoration:line-through;font-size:12px}
.till{margin-left:auto;background:#1c3856;color:#b9e1ff;border-radius:10px;padding:2px 7px;font-size:11.5px;font-weight:700;white-space:nowrap}
.empty{padding:40px 24px;text-align:center;color:var(--mut)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}
.sheet{position:fixed;inset:0;z-index:20;display:none}
.sheet.on{display:block}
.shade{position:absolute;inset:0;background:#02060cb3}
.pane{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:#10233a;border-radius:22px 22px 0 0;border-top:1px solid var(--line);padding:0 0 calc(18px + env(safe-area-inset-bottom));animation:up .22s ease-out;max-width:640px;margin:0 auto}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@media (prefers-reduced-motion:reduce){.pane{animation:none}.it{transition:none}}
.big{aspect-ratio:1.25;position:relative;background:linear-gradient(var(--c1),var(--c2))}
.big img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:bottom}
.x{position:absolute;top:10px;right:10px;z-index:2;width:40px;height:40px;border-radius:50%;border:0;background:#0a1626cc;color:#fff;font-size:20px;cursor:pointer}
.pb{padding:14px 18px}
.pb h2{margin:0 0 2px;font-size:24px;line-height:1.1}
.ty{color:var(--mut);font-size:13.5px}
.desc{margin:10px 0;color:#cfe0f2}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.f{background:#0d1d31;border:1px solid var(--line);border-radius:12px;padding:9px 11px}
.f span{display:block;color:var(--mut);font-size:12px}
.f b{font-size:15px}
.parts{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.part{flex:none;width:76px;text-align:center;font-size:11.5px;color:var(--mut)}
.part img{width:76px;height:76px;object-fit:contain;background:#0d1d31;border-radius:12px;border:1px solid var(--line)}
.btn{width:100%;height:50px;border-radius:14px;border:0;font:800 16px Manrope,sans-serif;cursor:pointer;margin-top:12px}
.btn.p{background:var(--acc);color:#07263b}
.btn.s{background:#1c3856;color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#e9f6ff;color:#08263c;font-weight:700;padding:11px 16px;border-radius:14px;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.vid{position:relative;aspect-ratio:16/9;background:#000}
.vid iframe,.vid>div{position:absolute;inset:0;width:100%;height:100%;border:0}
.vol{display:flex;align-items:center;gap:10px;padding:10px 18px 0}
.vol input{flex:1;accent-color:var(--acc);height:28px}
.vol span{width:42px;text-align:right;color:var(--mut);font-weight:700;font-size:13px}
.vol button{border:0;background:#1c3856;color:var(--ink);border-radius:10px;width:40px;height:36px;font-size:16px;cursor:pointer}
.more{display:block;margin:0 16px 20px;width:calc(100% - 32px)}
.inshop{position:absolute;top:7px;left:7px;z-index:1;border-radius:10px;padding:2px 8px;font-size:11.5px;font-weight:800;background:var(--acc);color:#07263b}
.note{margin:0 16px 18px;color:var(--mut);font-size:12.5px;text-align:center}
@media(max-width:380px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;padding-inline:10px}.tab{padding:7px 9px}}
</style>
</head>
<body>
<header>
  <div class="logo"><svg viewBox="0 0 24 34"><path d="M15 0 2 19h8l-4 15L22 13h-9z" fill="#f2fbff"/></svg></div>
  <div><h1>Магазин Fortnite</h1><div class="sub" id="date">загружаю…</div></div>
  <div class="tabs"><button class="tab on" id="tShop">Сегодня</button><button class="tab" id="tAll">Все</button><button class="tab" id="tMine">⭐ <span id="cnt">0</span></button></div>
</header>
<div class="bar">
  <input class="search" id="q" type="search" placeholder="Найти предмет…" autocomplete="off">
  <div class="chips" id="chips"></div>
</div>
<main class="grid" id="grid"></main>
<div class="empty" id="empty" hidden></div>
<button class="btn s more" id="more" hidden>Показать ещё</button>
<p class="note">Storm Radar · данные: fortnite-api.com</p>

<div class="sheet" id="sheet"><div class="shade" id="shade"></div><div class="pane" id="pane"></div></div>
<div class="toast" id="toast"></div>

<script>
{
const tg = window.Telegram && Telegram.WebApp;
const inTg = !!(tg && tg.initData);
if (inTg) { tg.ready(); tg.expand(); try { tg.setHeaderColor("#0d1b2e"); tg.setBackgroundColor("#0d1b2e"); } catch (e) {} }

const SHOP_CATS = [["all","Все"],["new","Новинки"],["back","Вернулись"],["outfit","Скины"],["emote","Эмоции"],["pickaxe","Кирки"],["glider","Дельтапланы"],["backpack","Рюкзаки"],["bundle","Наборы"],["wrap","Обёртки"],["shoe","Кроссовки"],["other","Остальное"]];
const ALL_CATS = [["all","Все"],["outfit","Скины"],["emote","Эмоции"],["pickaxe","Кирки"],["glider","Дельтапланы"],["backpack","Рюкзаки"],["wrap","Обёртки"],["shoe","Кроссовки"],["contrail","Следы"],["music","Музыка"],["other","Остальное"]];
const PAGE = 60;
// адрес бота на cloudflare (воркер). пусто — избранное хранится только в телеге, без уведомлений
const API = "https://stwradar.WORKER-SUBDOMAIN.workers.dev";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const DAY = 864e5;
const dayOf = s => Date.UTC(+s.slice(0,4), +s.slice(5,7)-1, +s.slice(8,10));
const fmt = (t, y) => { const d = new Date(t); const p = n => String(n).padStart(2,"0"); return p(d.getUTCDate())+"."+p(d.getUTCMonth()+1)+(y ? "."+d.getUTCFullYear() : ""); };
const plural = (n, a, b, c) => { const m = n%10, h = n%100; return m==1&&h!=11 ? a : m>=2&&m<=4&&(h<12||h>14) ? b : c; };
const $ = id => document.getElementById(id);

let shop = [], vbIcon = "", today = Date.now(), catalog = null, catLoading = false;
let view = "shop", cat = "all", query = "", shown = PAGE;
const inShop = new Map();   // id предмета -> позиция магазина

// ---------- избранное: облако телеги (синхронно между устройствами) + запасной localStorage
let fav = {};
try { fav = JSON.parse(localStorage.getItem("stw_fav") || "{}"); } catch (e) {}
if (inTg && tg.CloudStorage) try { tg.CloudStorage.getItem("fav", (err, v) => { if (!err && v) { try { fav = JSON.parse(v); render(); syncFav(); } catch (e) {} } }); } catch (e) {}
function saveFav() {
  const v = JSON.stringify(fav);
  try { localStorage.setItem("stw_fav", v); } catch (e) {}
  if (inTg && tg.CloudStorage) try { tg.CloudStorage.setItem("fav", v); } catch (e) {}
  syncFav();
}
// отправляем избранное боту, чтобы он написал, когда предмет появится в магазине
let syncT;
function syncFav() {
  if (!inTg || !API || API.includes("WORKER-SUBDOMAIN")) return;
  clearTimeout(syncT);
  syncT = setTimeout(() => {
    fetch(API + "/api/fav", { method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ initData: tg.initData, favs: Object.values(fav).map(f => ({ id: f.key, name: f.name })) }) })
      .catch(() => {});
  }, 600);
}
let askedWrite = false;
function askWrite() {
  // если миниапп открыли по ссылке, а не из чата с ботом, просим разрешение писать в личку
  if (askedWrite || !inTg || !tg.requestWriteAccess) return;
  askedWrite = true;
  try { tg.requestWriteAccess(() => {}); } catch (e) {}
}

// ---------- общий вид предмета (магазин и каталог приводим к одному формату)
const fromCat = c => ({ id: c.id, keys: [c.id], name: c.n, kind: c.k, typeName: c.t, rarity: c.r, set: c.s, desc: c.d,
  img: c.b || c.i, thumb: c.i, video: c.v, lastSeen: c.h, times: c.c, firstSeen: c.f, c1: "#22456a", c2: "#11243b" });
const cardFromShop = it => ({ ...it, thumb: it.img });

function badge(it) {
  if (it.isNew) return '<span class="bd n">НОВИНКА</span>';
  if (it.returned) return '<span class="bd ' + (it.days >= 365 ? "y" : "r") + '">↺ ' + it.days + ' дн.</span>';
  return "";
}
const vb = () => vbIcon ? '<img class="vb" src="' + esc(vbIcon) + '" alt="">' : "";

function card(it, mode) {
  const star = fav[it.keys[0]] ? '<span class="bell">⭐</span>' : "";
  const s = mode === "shop" ? it : inShop.get(it.id);
  const top = mode === "shop" ? badge(it) : (s ? '<span class="inshop">в магазине</span>' : "");
  const bottom = s
    ? vb() + '<span class="pr">' + s.price + '</span>' + (s.regular > s.price ? '<span class="old">' + s.regular + '</span>' : "") + (s.out ? '<span class="till">до ' + fmt(Date.parse(s.out)) + '</span>' : "")
    : '<span class="till" style="margin:0">' + (it.lastSeen ? "был " + fmt(dayOf(it.lastSeen), true) : "не продавался") + '</span>';
  return '<button class="it" data-id="' + esc(it.id) + '" data-m="' + mode + '" style="--c1:' + it.c1 + ';--c2:' + it.c2 + ';--b:' + it.c1 + 'aa;--g:' + it.c1 + '33">' +
    '<div class="art">' + (it.thumb ? '<img loading="lazy" src="' + esc(it.thumb) + '" alt="">' : "") + top + star + '<div class="nm">' + esc(it.name) + '</div></div>' +
    '<div class="info">' + bottom + '</div></button>';
}

// ---------- списки
function shopList() {
  const q = query.trim().toLowerCase();
  return shop.filter(it => (cat === "all" || (cat === "new" ? it.isNew : cat === "back" ? it.returned : it.kind === cat)) &&
    (!q || it.name.toLowerCase().includes(q) || it.typeName.toLowerCase().includes(q) || it.set.toLowerCase().includes(q)));
}
function allList() {
  if (!catalog) return [];
  const q = query.trim().toLowerCase();
  return catalog.filter(c => (cat === "all" || c.k === cat) && (!q || c.n.toLowerCase().includes(q) || c.s.toLowerCase().includes(q)));
}

function chips() {
  const src = view === "all" ? ALL_CATS : SHOP_CATS;
  const n = k => {
    if (view === "all") return catalog ? (k === "all" ? catalog.length : catalog.filter(c => c.k === k).length) : 0;
    return k === "all" ? shop.length : k === "new" ? shop.filter(i => i.isNew).length : k === "back" ? shop.filter(i => i.returned).length : shop.filter(i => i.kind === k).length;
  };
  $("chips").innerHTML = src.map(([k, t]) => { const c = n(k); return c || k === "all" ? '<button class="chip' + (k === cat ? " on" : "") + '" data-c="' + k + '">' + t + '<b>' + c + '</b></button>' : ""; }).join("");
}

function render() {
  const grid = $("grid"), empty = $("empty"), more = $("more");
  $("cnt").textContent = Object.keys(fav).length;
  document.querySelector(".bar").hidden = view === "mine";
  more.hidden = true;
  if (view === "mine") {
    const l = Object.values(fav);
    grid.innerHTML = l.map(f => {
      const s = inShop.get(f.id);
      return card(s ? cardFromShop(s) : { id: f.id, keys: [f.id], name: f.name, thumb: f.img, lastSeen: f.last, c1: "#22456a", c2: "#11243b" }, "fav");
    }).join("");
    empty.hidden = l.length > 0;
    empty.innerHTML = "<b>В избранном пусто</b>Открой любой предмет во вкладке «Все» и нажми ⭐ — бот напишет, когда он появится в магазине.";
    return;
  }
  if (view === "all" && !catalog) { grid.innerHTML = ""; empty.hidden = false; empty.innerHTML = "<b>Загружаю все предметы…</b>Это пара секунд."; return; }
  const l = view === "all" ? allList().map(fromCat) : shopList();
  grid.innerHTML = l.slice(0, shown).map(it => card(it, view === "all" ? "all" : "shop")).join("");
  more.hidden = l.length <= shown;
  empty.hidden = l.length > 0;
  empty.innerHTML = "<b>Ничего не нашлось</b>Попробуй другое название или фильтр.";
}

// ---------- видео с громкостью
let ytReady = null, player = null, vol = 50;
try { vol = +(localStorage.getItem("stw_vol") ?? 50); } catch (e) {}
function loadYT() {
  if (ytReady) return ytReady;
  ytReady = new Promise(res => {
    window.onYouTubeIframeAPIReady = res;
    const sc = document.createElement("script"); sc.src = "https://www.youtube.com/iframe_api"; document.head.appendChild(sc);
  });
  return ytReady;
}
function mountVideo(id) {
  loadYT().then(() => {
    if (!$("yt")) return;
    player = new YT.Player("yt", { videoId: id, playerVars: { autoplay: 1, playsinline: 1, rel: 0, modestbranding: 1, loop: 1, playlist: id },
      events: { onReady: e => { e.target.setVolume(vol); if (vol > 0) e.target.unMute(); else e.target.mute(); e.target.playVideo(); } } });
  });
}
function setVol(v) {
  vol = v; try { localStorage.setItem("stw_vol", v); } catch (e) {}
  $("vv").textContent = v + "%";
  if (player && player.setVolume) { player.setVolume(v); v > 0 ? player.unMute() : player.mute(); }
}

// ---------- карточка предмета
function openItem(it) {
  const s = inShop.get(it.id) || (it.price ? it : null);
  const key = it.keys[0], on = !!fav[key];
  const facts = [];
  if (s) facts.push(["Цена", s.price + " В-баксов"], ["В магазине до", s.out ? fmt(Date.parse(s.out), true) : "—"]);
  facts.push(["Последний раз в магазине", s && s.isNew ? "впервые сегодня" : s && s.days === 1 ? "вчера" : (s ? s.lastSeen : it.lastSeen) ? fmt(dayOf(s ? s.lastSeen : it.lastSeen), true) : "не продавался"]);
  facts.push(["Был в магазине", ((s ? s.times : it.times) || 0) + " " + plural((s ? s.times : it.times) || 0, "раз", "раза", "раз")]);
  if (it.rarity) facts.push(["Редкость", it.rarity]);
  const video = it.video || (s && s.video);
  $("pane").innerHTML =
    '<div class="big" style="--c1:' + it.c1 + ';--c2:' + it.c2 + '">' + (it.img ? '<img src="' + esc(it.img) + '" alt="">' : "") + '<button class="x" id="x" aria-label="Закрыть">✕</button></div>' +
    '<div class="pb"><h2>' + esc(it.name) + '</h2><div class="ty">' + esc([it.typeName, it.set].filter(Boolean).join(" · ")) + '</div>' +
    (it.desc ? '<p class="desc">' + esc(it.desc) + '</p>' : "") +
    '<div class="facts">' + facts.map(([a, b]) => '<div class="f"><span>' + a + '</span><b>' + esc(b) + '</b></div>').join("") + '</div>' +
    (it.parts && it.parts.length ? '<div class="ty" style="margin-bottom:6px">В наборе:</div><div class="parts">' + it.parts.map(p => '<div class="part">' + (p.img ? '<img loading="lazy" src="' + esc(p.img) + '" alt="">' : "") + '<div>' + esc(p.name) + '</div></div>').join("") + '</div>' : "") +
    '<button class="btn ' + (on ? "s" : "p") + '" id="w">' + (on ? "⭐ В избранном · убрать" : "⭐ В избранное — напомнить, когда появится") + '</button>' +
    (video ? '<button class="btn s" id="vid">▶ Смотреть видео на YouTube</button>' : "") +
    '<button class="btn s" id="share">Поделиться с другом</button></div>';
  $("sheet").classList.add("on");
  $("x").onclick = close;
  if (video) $("vid").onclick = () => {
    const u = "https://www.youtube.com/watch?v=" + encodeURIComponent(video);
    if (inTg && tg.openLink) tg.openLink(u); else window.open(u, "_blank");
  };
  $("w").onclick = () => {
    if (fav[key]) { delete fav[key]; toast("Убрано из избранного"); }
    else {
      fav[key] = { id: key, key, name: it.name, img: it.thumb || it.img, last: s ? s.lastSeen : it.lastSeen };
      askWrite();
      toast(s ? "Добавлено! Он уже в магазине 🎉" : "Добавлено! Напишем, когда «" + it.name + "» появится");
      if (inTg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
    }
    saveFav(); render();
    $("w").className = "btn " + (fav[key] ? "s" : "p");
    $("w").textContent = fav[key] ? "⭐ В избранном · убрать" : "⭐ В избранное — напомнить, когда появится";
  };
  $("share").onclick = () => {
    const text = s ? it.name + " сейчас в магазине Fortnite за " + s.price + " В-баксов" + (s.out ? ", до " + fmt(Date.parse(s.out)) : "") + " — смотри в @stwradar"
                   : it.name + " — когда появится в магазине Fortnite, узнаешь первым в @stwradar";
    const url = "https://t.me/share/url?url=" + encodeURIComponent("https://t.me/stwradar") + "&text=" + encodeURIComponent(text);
    if (inTg && tg.openTelegramLink) tg.openTelegramLink(url); else window.open(url, "_blank");
  };
}
function close() {
  $("sheet").classList.remove("on");
  if (player && player.destroy) try { player.destroy(); } catch (e) {}
  player = null; $("pane").innerHTML = "";
}
let tt;
function toast(t) { const el = $("toast"); el.textContent = t; el.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => el.classList.remove("on"), 2200); }

// ---------- события
$("shade").onclick = close;
document.addEventListener("keydown", e => { if (e.key === "Escape") close(); });
$("q").addEventListener("input", e => { query = e.target.value; shown = PAGE; render(); });
$("chips").addEventListener("click", e => { const b = e.target.closest(".chip"); if (!b) return; cat = b.dataset.c; shown = PAGE; chips(); render(); });
$("more").onclick = () => { shown += PAGE; render(); };
$("grid").addEventListener("click", e => {
  const b = e.target.closest(".it"); if (!b) return;
  const id = b.dataset.id;
  const s = shop.find(i => i.id === id) || inShop.get(id);
  if (s) return openItem(cardFromShop(s));
  const c = catalog && catalog.find(x => x.id === id);
  if (c) return openItem(fromCat(c));
  const f = Object.values(fav).find(x => x.id === id);
  if (f) { loadCatalog().then(() => { const c2 = catalog && catalog.find(x => x.id === id); if (c2) openItem(fromCat(c2)); }); }
});
function loadCatalog() {
  if (catalog || catLoading) return Promise.resolve();
  catLoading = true;
  return fetch("data/catalog.json").then(r => r.json()).then(d => { catalog = d; catLoading = false; chips(); render(); })
    .catch(() => { catLoading = false; toast("Не удалось загрузить каталог"); });
}
function setView(v) {
  view = v; cat = "all"; query = ""; shown = PAGE; $("q").value = "";
  $("q").placeholder = v === "all" ? "Найти любой предмет…" : "Найти в магазине…";
  ["tShop", "tAll", "tMine"].forEach((id, i) => $(id).classList.toggle("on", ["shop", "all", "mine"][i] === v));
  if (v === "all") loadCatalog();
  chips(); render(); window.scrollTo(0, 0);
}
$("tShop").onclick = () => setView("shop");
$("tAll").onclick = () => setView("all");
$("tMine").onclick = () => setView("mine");

fetch("data/shop.json").then(r => r.json()).then(d => {
  vbIcon = d.vbuck || ""; today = dayOf(d.date);
  shop = d.items.map(it => ({ ...it })).sort((a, b) => (b.isNew - a.isNew) || ((b.returned ? b.days : 0) - (a.returned ? a.days : 0)) || (a.order - b.order));
  shop.forEach(it => it.keys.forEach(k => inShop.set(k, it)));
  $("date").textContent = "сегодня, " + fmt(today, true) + " · " + shop.length + " " + plural(shop.length, "предмет", "предмета", "предметов");
  chips(); render();
}).catch(() => {
  $("date").textContent = "не удалось загрузить магазин";
  const e = $("empty"); e.hidden = false; e.innerHTML = "<b>Магазин не загрузился</b>Проверь интернет и обнови страницу.";
});
}
</script>
