<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c1a2a">
<title>Storm Radar · Магазин</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: тихая зимняя ночь канала Storm Radar, ничего лишнего
   IDEA: витрина за ледяным стеклом — предметы светятся цветом своей редкости
   PICTURE: сама сетка предметов
   COLOUR/TYPE: ночной синий, ледяной акцент #8cd7ff, Manrope
   LAYOUT: шапка → вкладки → поиск → фильтры → разделы с сеткой, шторка предмета снизу */
:root{--bg:#0c1a2a;--bg2:#112338;--glass:#ffffff0a;--line:#ffffff14;--ink:#eef6ff;--mut:#8ea9c4;--acc:#8cd7ff;--acc2:#bfe9ff;--gold:#ffd166;--new:#7cf0b0;--r:18px}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Manrope,system-ui,-apple-system,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding-bottom:calc(24px + env(safe-area-inset-bottom));background:
 radial-gradient(90% 40% at 15% -5%,#2b6a8a55,transparent 70%),radial-gradient(70% 35% at 95% 0,#4b4fa044,transparent 70%),var(--bg)}
button{font:inherit;color:inherit}
.wrap{max-width:900px;margin:0 auto}

header{display:flex;align-items:center;gap:12px;padding:calc(16px + env(safe-area-inset-top)) 16px 12px}
.logo{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#d7f2ff,#5fa9d6 55%,#2c5f86);box-shadow:0 0 18px #8cd7ff55}
.logo svg{width:20px;height:26px;filter:drop-shadow(0 1px 2px #0a2a4466)}
.brand{font-size:11.5px;font-weight:800;letter-spacing:.08em;color:var(--acc);text-transform:uppercase}
h1{margin:0;font-size:22px;line-height:1.1;font-weight:800}
.sub{color:var(--mut);font-size:13px;margin-top:2px}

.tabs{display:flex;gap:4px;margin:0 16px;padding:4px;border-radius:16px;background:var(--glass);border:1px solid var(--line)}
.tab{flex:1;border:0;background:transparent;color:#b3c8dc;border-radius:12px;padding:9px 6px;font-weight:700;font-size:14px;cursor:pointer;min-height:40px;transition:background .2s,color .2s;white-space:nowrap}
.tab.on{background:linear-gradient(#a9e3ff,#7fcdf7);color:#06263c;box-shadow:0 4px 14px #8cd7ff40}
.cnt{display:inline-block;min-width:18px;margin-left:4px;padding:0 5px;border-radius:9px;background:#ff4d7a;color:#fff;font-size:11.5px;line-height:18px;font-weight:800}
.tab svg{width:15px;height:15px;vertical-align:-2px;margin-right:4px;fill:currentColor}
.cnt.z{display:none}

.bar{position:sticky;top:0;z-index:5;padding:12px 16px 10px;background:#0c1a2ae6;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 0 0 100vmax #0c1a2ae6;clip-path:inset(0 -100vmax)}
.sbox{position:relative}
.sbox svg{position:absolute;left:14px;top:50%;width:18px;height:18px;transform:translateY(-50%);opacity:.55;pointer-events:none}
.search{width:100%;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--bg2);color:var(--ink);font:16px Manrope,sans-serif;padding:0 14px 0 42px;outline:none;transition:border-color .2s,box-shadow .2s}
.search:focus{border-color:#8cd7ff80;box-shadow:0 0 0 3px #8cd7ff22}
.search::placeholder{color:#6f8aa5}
.chips{display:flex;gap:6px;overflow-x:auto;padding-top:10px;scrollbar-width:none;scroll-padding-inline:16px}
.chips::-webkit-scrollbar{display:none}
.chips{cursor:grab;user-select:none;-webkit-user-select:none}
.chips.drag{cursor:grabbing}
.chips.drag .chip{pointer-events:none}
.chip{flex:none;border:1px solid var(--line);background:transparent;color:var(--mut);border-radius:20px;padding:7px 13px;font-size:13px;font-weight:700;cursor:pointer;min-height:36px;transition:all .2s}
.chip.on{background:#ffffff14;color:var(--ink);border-color:#ffffff30}
.chip b{font-weight:700;opacity:.55;margin-left:5px}

.sec{display:flex;align-items:center;gap:10px;margin:22px 16px 12px;font-size:17px;font-weight:800}
.sec i{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:none;background:linear-gradient(145deg,color-mix(in srgb,var(--sc) 30%,transparent),color-mix(in srgb,var(--sc) 10%,transparent));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--sc) 45%,transparent),0 4px 14px -6px var(--sc)}
.sec i svg{width:19px;height:19px;fill:none;stroke:var(--sc);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sec small{display:block;color:var(--mut);font-size:12.5px;font-weight:600;margin-top:1px}
.sec span{margin-left:auto;color:var(--mut);font-size:13px;font-weight:700;background:#ffffff0d;border-radius:10px;padding:3px 9px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(156px,1fr));gap:12px;padding:0 16px}

.it{position:relative;display:block;width:100%;padding:0;text-align:left;cursor:pointer;border-radius:var(--r);overflow:hidden;background:#0d1d30;border:0;
 box-shadow:0 0 0 1.5px var(--b,#3b5f80),0 8px 22px -10px var(--g,#0000);transition:transform .18s ease}
.it:active{transform:scale(.965)}
.art{position:relative;aspect-ratio:1/1.08;background:radial-gradient(110% 85% at 50% 18%,var(--c1),var(--c2) 78%)}
.art::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 40% at 50% 8%,#ffffff2e,transparent 70%);z-index:0}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center bottom;z-index:1;filter:drop-shadow(0 8px 12px #0007)}
.art img.bad{display:none}
.art::after{content:"";position:absolute;inset:auto 0 0;height:46%;background:linear-gradient(transparent,#060d18e6);z-index:2}
.nm{position:absolute;left:10px;right:10px;bottom:8px;z-index:3;font-weight:800;font-size:14px;line-height:1.18;text-shadow:0 1px 3px #000a;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bd{position:absolute;top:8px;left:8px;z-index:3;border-radius:8px;padding:3px 7px;font-size:11px;font-weight:800;letter-spacing:.02em;backdrop-filter:blur(6px)}
.bd.n{background:#7cf0b0e6;color:#053a20}.bd.r{background:#bfe9ffe6;color:#08304b}.bd.y{background:#ffd166f0;color:#3a2600}.bd.s{background:#8cd7ffe6;color:#06263c}
.hrt{position:absolute;top:6px;right:6px;z-index:4;width:34px;height:34px;border-radius:50%;border:0;padding:0;display:grid;place-items:center;cursor:pointer;
 background:#08121f73;backdrop-filter:blur(6px);transition:transform .2s,background .2s}
.hrt svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:2.2;transition:all .2s}
.hrt.on{background:#ff4d7a}
.hrt.on svg{fill:#fff;stroke:#fff}
.hrt.pop{animation:pop .35s}
@keyframes pop{40%{transform:scale(1.25)}}
.info{display:flex;align-items:center;gap:6px;padding:9px 10px 10px;border-top:2px solid var(--b,#3b5f80);background:#0b1828}
.vb{width:17px;height:17px;flex:none}
.pr{font-weight:800;font-size:15px}
.off{border-radius:7px;padding:1px 6px;font-size:11.5px;font-weight:800;background:#7cf0b0;color:#053a20}
.till{margin-left:auto;color:var(--mut);font-size:12px;font-weight:700;white-space:nowrap}
.till.m{margin-left:0}

.sk{border-radius:var(--r);aspect-ratio:1/1.32;background:linear-gradient(100deg,#ffffff08 30%,#ffffff14 50%,#ffffff08 70%) 0 0/200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.empty{padding:48px 28px;text-align:center;color:var(--mut)}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}
.empty .ill{width:96px;height:96px;margin:0 auto 16px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(#ff4d7a33,#ff4d7a08 70%)}
.empty .ill svg{width:44px;height:44px;fill:#ff6b91}
.empty p{margin:0 auto;max-width:300px}
.note{margin:28px 16px 0;color:#5f7a95;font-size:12px;text-align:center}
#more{height:1px}

.sheet{position:fixed;inset:0;z-index:20;visibility:hidden}
.sheet.on{visibility:visible}
.shade{position:absolute;inset:0;background:#02060cb8;opacity:0;transition:opacity .25s;backdrop-filter:blur(3px)}
.sheet.on .shade{opacity:1}
.pane{position:absolute;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;max-height:90vh;overflow:auto;background:#0f2034;border-radius:26px 26px 0 0;
 box-shadow:0 -1px 0 #ffffff1c,0 -20px 50px #0008;transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);padding-bottom:calc(20px + env(safe-area-inset-bottom))}
.sheet.on .pane{transform:none}
.grab{position:absolute;top:8px;left:50%;width:40px;height:4px;margin-left:-20px;border-radius:2px;background:#ffffff40;z-index:3}
.big{position:relative;aspect-ratio:1.15;background:radial-gradient(110% 85% at 50% 15%,var(--c1),var(--c2) 80%);border-bottom:3px solid var(--b)}
.big::before{content:"";position:absolute;inset:0;background:radial-gradient(55% 40% at 50% 5%,#ffffff33,transparent 70%)}
.big img{position:absolute;inset:4% 0 0;width:100%;height:96%;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 12px 18px #0008)}
.big video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .35s;z-index:1;background:#0a1626}
.big.vid video{opacity:1}
.vbar{display:none;align-items:center;gap:10px;padding:10px 18px 0}
.vbar.on{display:flex}
.vbar button{flex:none;width:40px;height:36px;border-radius:12px;border:1px solid var(--line);background:#ffffff0f;color:var(--ink);font-size:16px;cursor:pointer}
.vbar input{flex:1;height:28px;accent-color:#8cd7ff}
.vbar span{width:40px;text-align:right;color:var(--mut);font-size:13px;font-weight:700}
.src{display:block;margin:6px 18px 0;color:#6f8aa5;font-size:12px;text-decoration:none}
.src[hidden],.vbar[hidden]{display:none}
.x{position:absolute;top:14px;right:14px;z-index:3;width:38px;height:38px;border-radius:50%;border:0;background:#08121fb0;color:#fff;font-size:18px;cursor:pointer;backdrop-filter:blur(6px)}
.pb{padding:16px 18px 4px}
.pb h2{margin:0;font-size:25px;line-height:1.12;font-weight:800}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{border-radius:8px;padding:3px 9px;font-size:12.5px;font-weight:700;background:#ffffff10;color:var(--acc2)}
.tag.rar{background:var(--b);color:#08121f}
.desc{margin:12px 0 4px;color:#c3d6ea;font-size:14.5px}
.rows{margin:12px 0;border-radius:16px;background:var(--glass);border:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;font-size:14px}
.row svg{width:18px;height:18px;flex:none;stroke:var(--acc);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.row+.row{border-top:1px solid var(--line)}
.row span{color:var(--mut)}
.row b{margin-left:auto;text-align:right;font-weight:700}
.parts{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:10px 8px;padding:2px 0 6px}
.part{min-width:0;text-align:center;font-size:11.5px;color:var(--mut);line-height:1.25;transition:transform .15s}.part:active{transform:scale(.96)}
.part img{display:block;width:100%;aspect-ratio:1;object-fit:contain;border-radius:14px;background:#ffffff0a;border:1px solid var(--line);margin-bottom:5px}
.btn{display:block;width:100%;height:52px;border-radius:16px;border:0;font-weight:800;font-size:16px;cursor:pointer;margin-top:10px;transition:transform .15s}
.btn:active{transform:scale(.98)}
.btn.p{background:linear-gradient(#a9e3ff,#7fcdf7);color:#06263c;box-shadow:0 6px 18px #8cd7ff40}
.btn.h{background:linear-gradient(#ff7b9c,#ff4d7a);color:#fff;box-shadow:0 6px 18px #ff4d7a55}
.btn.hon{background:#ff4d7a1f;color:#ff9ab3;border:1px solid #ff4d7a55}
.btn svg{width:18px;height:18px;vertical-align:-3px;margin-right:6px;fill:currentColor}
.btn.s{background:#ffffff0f;color:var(--ink);border:1px solid var(--line)}
.srcs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px}
.sc{border-radius:10px;padding:6px 10px;font-size:13px;font-weight:700;background:#ffffff0d;border:1px solid var(--line);color:var(--ink)}
.lbl{color:var(--mut);font-size:13px;font-weight:700;margin:14px 0 8px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#eaf7ff;color:#06263c;font-weight:700;padding:12px 18px;border-radius:14px;z-index:30;opacity:0;pointer-events:none;transition:all .25s;max-width:90vw;text-align:center;box-shadow:0 10px 30px #0008}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media(min-width:760px){
 .grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
 .pane{top:50%;bottom:auto;left:50%;right:auto;width:min(560px,92vw);max-height:88vh;border-radius:24px;transform:translate(-50%,-46%) scale(.97);opacity:0;transition:transform .25s,opacity .25s}
 .sheet.on .pane{transform:translate(-50%,-50%);opacity:1}
 .grab{display:none}
 .big{aspect-ratio:1.45}
}
@media(hover:hover){.it:hover{transform:translateY(-3px)}.prow:hover,.pkl:hover,.part:hover{filter:brightness(1.15)}.prow:hover img{transform:scale(1.04)}.chip:hover,.tab:hover{color:var(--ink)}}
@media(max-width:430px){.tab{font-size:13px;padding:9px 3px}.tab svg{display:none}}
@media(max-width:380px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:0 12px}.sec{margin-inline:12px}.tab{font-size:13px}}

/* наборы — как витрина: обложка слева, название и цена справа */
.pgrid{display:grid;grid-template-columns:1fr;gap:10px;padding:0 16px}
.prow{display:flex;align-items:center;gap:14px;width:100%;padding:8px;border:0;border-radius:18px;cursor:pointer;color:var(--ink);font:inherit;text-align:left;
 background:linear-gradient(135deg,#ffffff0d,#ffffff05);box-shadow:inset 0 0 0 1px var(--line),0 10px 24px -16px #000;transition:filter .2s}
.prow img{flex:none;width:76px;height:76px;border-radius:14px;object-fit:cover;background:#ffffff0a;box-shadow:0 6px 16px -8px #000a;transition:transform .25s}
.pr-t{min-width:0;display:flex;flex-direction:column;gap:5px}
.pr-t b{font-size:15.5px;font-weight:800;font-style:italic;text-transform:uppercase;letter-spacing:.02em;line-height:1.15;overflow-wrap:anywhere}
.pr-t em{font-style:italic;font-weight:800;font-size:14.5px;color:#ffd166;letter-spacing:.01em}
.prow.in{margin-bottom:8px}.prow.in img{width:64px;height:64px}
.buybar{display:flex;align-items:center;gap:12px;width:calc(100% - 32px);margin:14px 16px 0;padding:14px 16px;border-radius:16px;border:0;cursor:pointer;text-align:left;font:inherit;color:#3a2600;
 background:linear-gradient(135deg,#ffe08a,#ffc24a);box-shadow:0 10px 24px -12px #ffc24a99}
.buybar b{display:block;font-size:15px;font-weight:800}.buybar small{display:block;font-size:12.5px;font-weight:700;opacity:.75;margin-top:2px}
.buybar i{margin-left:auto;font-style:normal;font-size:26px;font-weight:800;line-height:1}
.pk-old{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px}
.pkl{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#ffffff08;color:var(--ink);border-radius:12px;padding:7px 11px;font:600 13px Manrope,sans-serif;cursor:pointer;text-align:left}
.pkl-i{display:flex}.pkl-i img{width:26px;height:26px;border-radius:7px;object-fit:contain;background:#ffffff10;margin-right:-6px;box-shadow:0 0 0 2px #0c1a2a}
.pkl-i+span{margin-left:6px}
.phead{position:relative;height:210px;overflow:hidden;display:grid;place-items:center;border-bottom:1px solid var(--line)}
.pbg{position:absolute;inset:-30px;background-size:cover;background-position:center;filter:blur(28px) saturate(1.4) brightness(.55);transform:scale(1.1)}
.part0{position:relative;width:160px;height:160px;border-radius:22px;object-fit:cover;box-shadow:0 14px 34px -10px #000,0 0 0 1px #ffffff26}
.ph2{font-style:italic;text-transform:uppercase;letter-spacing:.02em}
.pen{color:var(--mut);font-size:13px;font-weight:600;margin-top:4px}
.pprice{display:inline-block;margin-top:12px;padding:8px 16px;border-radius:12px;background:#ffd16622;color:#ffd166;font-weight:800;font-style:italic;font-size:18px;box-shadow:inset 0 0 0 1px #ffd16655}
.btn.g{background:linear-gradient(#ffe08a,#ffbf3f);color:#3a2600;box-shadow:0 6px 18px #ffbf3f44}
button.part{border:0;background:none;padding:0;cursor:pointer;font:inherit;color:var(--mut)}
button.part img{background:radial-gradient(90% 90% at 50% 20%,var(--c1,#ffffff14),var(--c2,#ffffff08))}
/* стили предмета */
.sty{padding:0 18px}
.stg{margin-top:12px}
.stl{color:var(--mut);font-size:12px;font-weight:800;letter-spacing:.06em;margin-bottom:7px;text-align:center}
.sts{display:flex;gap:8px;overflow-x:auto;padding:2px;justify-content:safe center;scrollbar-width:none}
.st{flex:none;width:54px;height:54px;padding:0;border-radius:12px;border:0;cursor:pointer;background:#ffffff0d;box-shadow:inset 0 0 0 1px var(--line);overflow:hidden;opacity:.65;transition:all .2s}
.st img{width:100%;height:100%;object-fit:cover}
.st.on{opacity:1;box-shadow:0 0 0 2px var(--b,#8cd7ff),0 6px 14px -6px var(--b,#8cd7ff)}
@media(min-width:620px){.pgrid{grid-template-columns:1fr 1fr;gap:12px}.prow img{width:92px;height:92px}}
@media(min-width:1100px){.pgrid{grid-template-columns:1fr 1fr 1fr}}
@media(max-width:380px){.pgrid{padding:0 12px}.prow img{width:66px;height:66px}.pr-t b{font-size:14px}}
.tg-l{border:0;cursor:pointer;font-family:inherit}.tg-l:hover{filter:brightness(1.25)}
.sc{display:inline-flex;align-items:center;gap:7px}.sc i{width:7px;height:7px;border-radius:50%;background:var(--b,#8cd7ff);box-shadow:0 0 8px var(--b,#8cd7ff)}
.fs{margin-left:auto;flex:none;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:#ffffff0d;color:var(--ink);display:grid;place-items:center;cursor:pointer;transition:background .2s}
.fs[hidden]{display:none}.fs:hover{background:#ffffff1a}.fs svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fs .fs-off,body.full .fs .fs-on{display:none}body.full .fs .fs-off{display:block}
body.full header{padding-top:calc(16px + var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px))}
.prow{--pc:#ffd166;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--pc) 75%,transparent),0 12px 28px -16px var(--pc)!important;
 background:linear-gradient(120deg,color-mix(in srgb,var(--pc) 22%,#0d1d30),#0d1d30 62%)!important}
.prow img{box-shadow:0 0 0 1px color-mix(in srgb,var(--pc) 55%,transparent),0 8px 18px -8px color-mix(in srgb,var(--pc) 70%,#000)!important}
.prow .pr-t em{color:color-mix(in srgb,var(--pc) 55%,#fff)}
.phead{--pc:#ffd166}.part0{box-shadow:0 0 0 2px var(--pc),0 16px 40px -10px var(--pc)!important}
.pprice{background:color-mix(in srgb,var(--pc) 20%,transparent)!important;color:color-mix(in srgb,var(--pc) 50%,#fff)!important;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--pc) 60%,transparent)!important}
.vbar button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.stov{position:absolute;left:12px;bottom:12px;z-index:2;width:30%;max-width:150px;border-radius:14px;overflow:hidden;background:#0a1626e6;box-shadow:0 0 0 2px var(--b,#8cd7ff),0 10px 24px -8px #000;animation:stin .25s ease}
.stov img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
.stov span{display:block;padding:5px 7px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;text-align:center;color:#fff}
@keyframes stin{from{opacity:0;transform:translateY(8px) scale(.95)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="logo" aria-hidden="true"><svg viewBox="0 0 20 28"><path d="M13 0 1 16h7l-3 12L19 10h-7z" fill="#fff"/></svg></div>
  <div><div class="brand">Storm Radar</div><h1 id="title">Магазин Fortnite</h1><div class="sub" id="date">загружаю…</div></div>
  <button class="fs" id="fs" hidden aria-label="На весь экран"><svg viewBox="0 0 24 24" class="fs-on"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><svg viewBox="0 0 24 24" class="fs-off"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg></button>
</header>
<nav class="tabs">
  <button class="tab on" id="tShop">Сегодня</button>
  <button class="tab" id="tAll">Каталог</button>
  <button class="tab" id="tPacks">Наборы</button>
  <button class="tab" id="tMine"><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.8 4.5c2.1 0 3.6 1.2 4.4 2.5h1.6c.8-1.3 2.3-2.5 4.4-2.5 3.8 0 5.9 3.9 4.4 7.3C19.5 16.4 12 21 12 21z"/></svg>Избранное<span id="cnt" class="cnt z">0</span></button>
</nav>
<div class="bar" id="bar">
  <div class="sbox">
    <svg viewBox="0 0 24 24" fill="none" stroke="#cfe6ff" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
    <input class="search" id="q" type="search" placeholder="Найти в магазине" autocomplete="off" enterkeyhint="search">
  </div>
  <div class="chips" id="chips"></div>
</div>
<main id="list"></main>
<div id="more"></div>
<div class="empty" id="empty" hidden></div>
<p class="note">Storm Radar · t.me/stwradar</p>
</div>

<div class="sheet" id="sheet" aria-hidden="true"><div class="shade" id="shade"></div><div class="pane" id="pane" role="dialog"></div></div>
<div class="toast" id="toast"></div>
<script>
{
const tg = window.Telegram && Telegram.WebApp;
const inTg = !!(tg && tg.initData);
// ---------- самообновление: телега любит держать старую версию страницы в кэше
const BUILD = "2026-11-25g";
fetch("index.html?nocache=" + Date.now(), { cache: "no-store" }).then(r => r.text()).then(t => {
  const m = t.match(/const BUILD = "([^"]+)"/);
  if (m && m[1] !== BUILD) {
    let tried = ""; try { tried = sessionStorage.getItem("stw_upd") || ""; } catch (e) {}
    if (tried !== m[1]) { try { sessionStorage.setItem("stw_upd", m[1]); } catch (e) {} location.replace(location.pathname + "?v=" + m[1] + location.hash); }
  }
}).catch(() => {});
if (inTg) {
  try { tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch (e) {}
  const canFs = tg.isVersionAtLeast && tg.isVersionAtLeast("8.0") && tg.requestFullscreen;
  if (canFs) {
    const b = document.getElementById("fs"); b.hidden = false;
    const paint = () => { document.body.classList.toggle("full", !!tg.isFullscreen); b.setAttribute("aria-label", tg.isFullscreen ? "Свернуть" : "На весь экран"); };
    b.onclick = () => { try { tg.isFullscreen ? tg.exitFullscreen() : tg.requestFullscreen(); } catch (e) {} };
    tg.onEvent("fullscreenChanged", paint); paint();
  }
}
if (inTg) { tg.ready(); tg.expand(); try { tg.setHeaderColor("#0c1a2a"); tg.setBackgroundColor("#0c1a2a"); tg.setBottomBarColor && tg.setBottomBarColor("#0c1a2a"); } catch (e) {} }

// адрес бота на cloudflare — сюда уходит избранное для уведомлений
const API = "https://stwradar.perlgraal1337.workers.dev";
// «где купить»: ссылка на магазин-партнёра. пусто — кнопка не показывается
const BUY_URL = "https://t.me/FNPacksBot";
const BUY_NAME = "FNPacks";
const KINDS = [["bundle","Наборы"],["outfit","Скины"],["emote","Эмоции"],["pickaxe","Кирки"],["glider","Дельтапланы"],["backpack","Рюкзаки"],["wrap","Обёртки"],["shoe","Кроссовки"],["contrail","Следы"],["music","Музыка"],["other","Остальное"]];
const SHOP_CATS = [["all","Все"],["new","Новинки"],["back","Вернулись"], ...KINDS];
const ALL_CATS = [["all","Все"], ...KINDS.filter(([k]) => k !== "bundle")];
const PAGE = 48;
const IC = {
  heart: '<svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.8 4.5c2.1 0 3.6 1.2 4.4 2.5h1.6c.8-1.3 2.3-2.5 4.4-2.5 3.8 0 5.9 3.9 4.4 7.3C19.5 16.4 12 21 12 21z"/></svg>',
  coin: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M9 9.5h4.5a2 2 0 0 1 0 4H9.5m0-4v7"/></svg>',
  clock: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>',
  back: '<svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v4h4"/></svg>',
  repeat: '<svg viewBox="0 0 24 24"><path d="M17 2l3 3-3 3"/><path d="M4 11V9a4 4 0 0 1 4-4h12"/><path d="M7 22l-3-3 3-3"/><path d="M20 13v2a4 4 0 0 1-4 4H4"/></svg>',
  star: '<svg viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.6 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/></svg>',
  gem: '<svg viewBox="0 0 24 24"><path d="M6 3h12l4 6-10 12L2 9z"/><path d="M2 9h20M12 21 8 9l4-6 4 6z"/></svg>',
};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const DAY = 864e5;
const dayOf = s => Date.UTC(+s.slice(0,4), +s.slice(5,7)-1, +s.slice(8,10));
const fmt = (t, y) => { const d = new Date(t); const p = n => String(n).padStart(2,"0"); return p(d.getUTCDate())+"."+p(d.getUTCMonth()+1)+(y ? "."+d.getUTCFullYear() : ""); };
const plural = (n, a, b, c) => { const m = n%10, h = n%100; return m==1&&h!=11 ? a : m>=2&&m<=4&&(h<12||h>14) ? b : c; };
const $ = id => document.getElementById(id);
const haptic = t => { try { inTg && tg.HapticFeedback && (t === "sel" ? tg.HapticFeedback.selectionChanged() : tg.HapticFeedback.notificationOccurred(t)); } catch (e) {} };

let packs = null;
let shop = [], vbIcon = "", today = Date.now(), catalog = null, catLoading = false;
let view = "shop", cat = "all", query = "", shown = PAGE, current = [];
const inShop = new Map();   // предмет -> где его сейчас можно купить (сам или в наборе)
const ownShop = new Map();  // предмет -> позиция, где продаётся именно он сам

// ---------- избранное: облако телеги + localStorage + бот на cloudflare
let fav = {};
try { fav = JSON.parse(localStorage.getItem("stw_fav") || "{}"); } catch (e) {}
if (inTg && tg.CloudStorage) try { tg.CloudStorage.getItem("fav", (err, v) => { if (!err && v) { try { fav = JSON.parse(v); render(); syncFav(); } catch (e) {} } }); } catch (e) {}
function saveFav() {
  const v = JSON.stringify(fav);
  try { localStorage.setItem("stw_fav", v); } catch (e) {}
  if (inTg && tg.CloudStorage) try { tg.CloudStorage.setItem("fav", v); } catch (e) {}
  syncFav();
}
let syncT;
function syncFav() {
  if (!inTg || !API) return;
  clearTimeout(syncT);
  syncT = setTimeout(() => {
    fetch(API + "/api/fav", { method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ initData: tg.initData, favs: Object.values(fav).map(f => ({ id: f.key, name: f.name })) }) }).catch(() => {});
  }, 600);
}
let askedWrite = false;
function askWrite() {
  if (askedWrite || !inTg || !tg.requestWriteAccess) return;
  askedWrite = true;
  try { tg.requestWriteAccess(() => {}); } catch (e) {}
}

// ---------- предметы
const fromCat = c => ({ id: c.id, keys: [c.id], name: c.n, kind: c.k, typeName: c.t, rarity: c.r, set: c.s, desc: c.d,
  img: c.b || c.i, thumb: c.i, src: c.o || [], intro: c.in || "", lastSeen: c.h, times: c.c, firstSeen: c.f, c1: c.c1 || "#22456a", c2: c.c2 || "#11243b", rb: c.c1 });
const fromShop = it => ({ ...it, thumb: it.img });

function badge(it, mode) {
  if (mode !== "shop") return inShop.has(it.id) ? '<span class="bd s">в магазине</span>' : "";
  if (it.isNew) return '<span class="bd n">НОВИНКА</span>';
  if (it.returned) return '<span class="bd ' + (it.days >= 365 ? "y" : "r") + '">↺ ' + it.days + ' дн.</span>';
  return "";
}
const vb = () => vbIcon ? '<img class="vb" src="' + esc(vbIcon) + '" alt="">' : "";
function card(it, mode) {
  const s = mode === "shop" ? it : ownShop.get(it.id);
  const inB = !s && mode !== "shop" ? inShop.get(it.id) : null;
  const rb = it.rb || it.c1;
  const pic = it.thumb || it.img;
  const bottom = s
    ? vb() + '<span class="pr">' + s.price + '</span>' + (s.regular > s.price ? '<span class="off">−' + Math.round((1 - s.price / s.regular) * 100) + '%</span>' : "") + (s.out ? '<span class="till">до ' + fmt(Date.parse(s.out)) + '</span>' : "")
    : inB ? '<span class="till m">в магазине в наборе</span>'
    : '<span class="till m">' + (it.lastSeen ? "был " + fmt(dayOf(it.lastSeen), true) : "не продавался") + '</span>';
  return '<button class="it" data-id="' + esc(it.id) + '" style="--c1:' + it.c1 + ';--c2:' + it.c2 + ';--b:' + rb + ';--g:' + rb + '">' +
    '<div class="art">' + (pic ? '<img loading="lazy" decoding="async" src="' + esc(pic) + '" alt="">' : "") + badge(it, mode) +
    '<span class="hrt' + (fav[it.keys[0]] ? " on" : "") + '" role="button" aria-label="В избранное" data-h="1">' + IC.heart + '</span>' + '<div class="nm">' + esc(it.name) + '</div></div>' +
    '<div class="info">' + bottom + '</div></button>';
}
const grid = (items, mode) => '<div class="grid">' + items.map(i => card(i, mode)).join("") + '</div>';
const sec = (title, n, ico, sub) => '<div class="sec">' + (ico && SECI[ico] ? '<i style="--sc:' + SECI[ico][1] + '">' + SECI[ico][0] + '</i>' : "") + '<div>' + title + (sub ? '<small>' + sub + '</small>' : "") + '</div><span>' + n + '</span></div>';
const SRC_ICO = {};
const SECI = {new:['<svg viewBox="0 0 24 24"><path d="M12 2l1.8 5.2L19 9l-5.2 1.8L12 16l-1.8-5.2L5 9l5.2-1.8zM19 14l.9 2.1L22 17l-2.1.9L19 20l-.9-2.1L16 17l2.1-.9z"/></svg>',"#7cf0b0"],back:['<svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 13.7-5.6L20 9M20 4v5h-5M20 12a8 8 0 0 1-13.7 5.6L4 15M4 20v-5h5"/></svg>',"#ffd166"],bundle:['<svg viewBox="0 0 24 24"><path d="M4 10h16v10H4zM3 7h18v3H3zM12 7v13M12 7c-2-4-6-3-5-.5S12 7 12 7zm0 0c2-4 6-3 5-.5S12 7 12 7z"/></svg>',"#ff9bd1"],outfit:['<svg viewBox="0 0 24 24"><path d="M12 3a3 3 0 1 1 0 6 3 3 0 0 1 0-6zM6 21v-4a6 6 0 0 1 12 0v4"/></svg>',"#8cd7ff"],emote:['<svg viewBox="0 0 24 24"><path d="M9 18V6l10-2v12M9 18a3 3 0 1 1-3-3 3 3 0 0 1 3 3zm10-2a3 3 0 1 1-3-3 3 3 0 0 1 3 3z"/></svg>',"#c59bff"],pickaxe:['<svg viewBox="0 0 24 24"><path d="M14 6l4 4M4 20l9-9M9 4c4-1 9 0 11 6-3-2-6-3-11-6z"/></svg>',"#ffb37a"],glider:['<svg viewBox="0 0 24 24"><path d="M2 9c6-5 14-5 20 0l-10 3zM12 12v8M9 20h6"/></svg>',"#9be7ff"],backpack:['<svg viewBox="0 0 24 24"><path d="M7 8a5 5 0 0 1 10 0v12H7zM9 4h6M9 14h6"/></svg>',"#ffd88c"],wrap:['<svg viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16zM14 6l3 3"/></svg>',"#ff8fa3"],shoe:['<svg viewBox="0 0 24 24"><path d="M3 16h18v3H3zM3 16l1-8 5 2 3 3 7 1 2 2"/></svg>',"#b6f09c"],contrail:['<svg viewBox="0 0 24 24"><path d="M3 17c4 0 5-10 10-10M7 20c4 0 5-7 9-7M17 4l3 3-3 3"/></svg>',"#a7b8ff"],music:['<svg viewBox="0 0 24 24"><path d="M9 18V6l10-2v12M9 18a3 3 0 1 1-3-3 3 3 0 0 1 3 3zm10-2a3 3 0 1 1-3-3 3 3 0 0 1 3 3z"/></svg>',"#c59bff"],other:['<svg viewBox="0 0 24 24"><path d="M4 7l8-4 8 4v10l-8 4-8-4zM4 7l8 4 8-4M12 11v10"/></svg>',"#b3c8dc"],cart:['<svg viewBox="0 0 24 24"><path d="M3 4h2l2 11h11l2-8H6M9 20h.01M17 20h.01"/></svg>',"#7cf0b0"],wait:['<svg viewBox="0 0 24 24"><path d="M7 3h10M7 21h10M8 3c0 5 8 5 8 9s-8 4-8 9M16 3c0 5-8 5-8 9"/></svg>',"#ffd166"],card:['<svg viewBox="0 0 24 24"><path d="M3 6h18v12H3zM3 10h18M7 15h4"/></svg>',"#ffd166"],archive:['<svg viewBox="0 0 24 24"><path d="M3 5h18v4H3zM5 9v10h14V9M10 13h4"/></svg>',"#b3c8dc"]};
const SEC_ICO = { bundle: "🎁", outfit: "🧍", emote: "💃", pickaxe: "⛏️", glider: "🪂", backpack: "🎒", wrap: "🎨", shoe: "👟", contrail: "✨", music: "🎵", other: "📦" };

// ---------- списки
const match = (txt, q) => txt.toLowerCase().includes(q);
function shopList() {
  const q = query.trim().toLowerCase();
  return shop.filter(it => (cat === "all" || (cat === "new" ? it.isNew : cat === "back" ? it.returned : it.kind === cat)) &&
    (!q || match(it.name, q) || match(it.typeName, q) || match(it.set, q)));
}
function allList() {
  if (!catalog) return [];
  const q = query.trim().toLowerCase();
  return catalog.filter(c => (cat === "all" || c.k === cat) && (!q || match(c.n, q) || match(c.s, q) || match(c.r, q)));
}
function chips() {
  const src = view === "all" ? ALL_CATS : SHOP_CATS;
  const n = k => view === "all"
    ? (catalog ? (k === "all" ? catalog.length : catalog.filter(c => c.k === k).length) : 0)
    : (k === "all" ? shop.length : k === "new" ? shop.filter(i => i.isNew).length : k === "back" ? shop.filter(i => i.returned).length : shop.filter(i => i.kind === k).length);
  $("chips").innerHTML = src.map(([k, t]) => { const c = n(k); return c || k === "all" ? '<button class="chip' + (k === cat ? " on" : "") + '" data-c="' + k + '">' + t + '<b>' + c + '</b></button>' : ""; }).join("");
}

function render() {
  const list = $("list"), empty = $("empty");
  const n = Object.keys(fav).length;
  $("cnt").textContent = n; $("cnt").classList.toggle("z", !n);
  $("bar").hidden = view === "mine" || view === "packs";
  empty.hidden = true;

  if (view === "mine") {
    const l = Object.values(fav).map(f => { const s = ownShop.get(f.id); return s ? { ...fromShop(s), id: f.id } : { id: f.id, keys: [f.id], name: f.name, thumb: f.img, lastSeen: f.last, c1: f.c1 || "#22456a", c2: f.c2 || "#11243b", rb: f.c1 }; });
    const now = l.filter(i => inShop.has(i.id)), wait = l.filter(i => !inShop.has(i.id));
    list.innerHTML = (now.length ? sec("Уже в магазине", now.length, "cart", "можно покупать прямо сейчас") + grid(now, "fav") : "") +
      (wait.length ? sec("Ждём в магазине", wait.length, "wait", "бот напишет, когда появятся") + grid(wait, "fav") : "");
    if (!l.length) { empty.hidden = false; empty.innerHTML = '<div class="ill">' + IC.heart + '</div><b>В избранном пусто</b><p>Нажми на сердечко на любом предмете — бот напишет тебе, как только он появится в магазине.</p>'; }
    return;
  }
  if (view === "packs") {
    if (!packs) { list.innerHTML = '<div class="pgrid">' + '<div class="sk" style="height:88px"></div>'.repeat(6) + '</div>'; return; }
    const on = packs.filter(p => p.active !== false), off = packs.filter(p => p.active === false);
    list.innerHTML = (on.length ? sec("Наборы в продаже", on.length, "card", "цены " + BUY_NAME + " · рубли / гривны") + '<div class="pgrid">' + on.map(packCard).join("") + '</div>' : "") +
      '<button class="buybar" id="buybar"><span><b>Нет нужного набора?</b><small>' + esc(BUY_NAME) + ' закажет любой — напиши в поддержку</small></span><i>›</i></button>' +
      (off.length ? sec("Больше не продаются", off.length, "archive", "можно заказать через " + BUY_NAME) + '<div class="pk-old">' + off.map(packCard).join("") + '</div>' : "");
    if ($("buybar")) $("buybar").onclick = openBuy;
    if (!packs.length) { empty.hidden = false; empty.innerHTML = "<b>Наборов пока нет</b><p>Скоро здесь появятся наборы за реальные деньги.</p>"; }
    return;
  }
  if (view === "all") {
    if (!catalog) { list.innerHTML = '<div class="grid">' + '<div class="sk"></div>'.repeat(8) + '</div>'; return; }
    current = allList();
    list.innerHTML = current.length ? grid(current.slice(0, shown).map(fromCat), "all") : "";
  } else {
    const l = shopList();
    if (cat === "all" && !query.trim()) {
      const parts = [], used = new Set();
      const add = (t, arr) => { if (arr.length) { parts.push(sec(t, arr.length) + grid(arr, "shop")); arr.forEach(i => used.add(i)); } };
      const add2 = (t, arr, ico, sub) => { if (arr.length) { parts.push(sec(t, arr.length, ico, sub) + grid(arr, "shop")); arr.forEach(i => used.add(i)); } };
      add2("Новинки", l.filter(i => i.isNew), "new", "впервые в магазине");
      add2("Вернулись", l.filter(i => i.returned).sort((a, b) => b.days - a.days), "back", "давно не было в магазине");
      for (const [k, t] of KINDS) add2(t, l.filter(i => i.kind === k && !used.has(i)), SECI[k] ? k : "other");
      list.innerHTML = parts.join("");
    } else list.innerHTML = l.length ? grid(l, "shop") : "";
    current = l;
  }
  if (!current.length) { empty.hidden = false; empty.innerHTML = "<b>Ничего не нашлось</b><p>Попробуй другое название или фильтр.</p>"; }
}

// плавное появление картинок
document.addEventListener("load", e => { if (e.target.tagName === "IMG") e.target.classList.add("ok"); }, true);
document.addEventListener("error", e => { if (e.target.tagName === "IMG") e.target.classList.add("bad"); }, true);

// бесконечная прокрутка каталога
new IntersectionObserver(es => {
  if (es[0].isIntersecting && view === "all" && catalog && shown < current.length) {
    const from = shown; shown += PAGE;
    const g = $("list").querySelector(".grid");
    if (g) g.insertAdjacentHTML("beforeend", current.slice(from, shown).map(c => card(fromCat(c), "all")).join(""));
  }
}, { rootMargin: "800px" }).observe($("more"));

// ---------- наборы за реальные деньги (packs.json, ведётся вручную, цены — FNPacks)
let packsLoading = null;
const ensurePacks = () => packs ? Promise.resolve(packs) : (packsLoading = packsLoading || fetch("data/packs.json").then(r => r.json()).then(d => (packs = Array.isArray(d) ? d : [])).catch(() => (packs = [])));
const packItems = p => p.full || [];
const rub = p => p.rub ? p.rub + " ₽" + (p.uah ? " / " + p.uah + " ₴" : "") : "";
const packArt = p => p.img || (packItems(p)[0] || {}).i || "";
function packCard(p) {
  const i = packs.indexOf(p);
  if (p.active === false) {
    const ic = packItems(p).filter(x => x.i).slice(0, 3).map(x => '<img loading="lazy" src="' + esc(x.i) + '" alt="">').join("");
    return '<button class="pkl" data-p="' + i + '">' + (ic ? '<span class="pkl-i">' + ic + '</span>' : "") + '<span>' + esc(p.name || p.en) + '</span></button>';
  }
  return '<button class="prow" data-p="' + i + '"' + (p.c ? ' style="--pc:' + esc(p.c) + '"' : "") + '><img loading="lazy" src="' + esc(packArt(p)) + '" alt=""><span class="pr-t"><b>' + esc(p.name) + '</b>' +
    (rub(p) ? '<em>' + esc(rub(p)) + '</em>' : "") + '</span></button>';
}
function openBuy() { if (inTg && tg.openTelegramLink && BUY_URL.startsWith("https://t.me/")) tg.openTelegramLink(BUY_URL); else window.open(BUY_URL, "_blank"); }
function openPack(p) {
  const on = p.active !== false, art = packArt(p);
  const parts = packItems(p).map(x => '<button class="part" data-id="' + esc(x.id || "") + '"' + (x.c1 ? ' style="--c1:' + x.c1 + ';--c2:' + x.c2 + '"' : "") + '>' + (x.i ? '<img loading="lazy" src="' + esc(x.i) + '" alt="">' : "") + '<div>' + esc(x.n) + '</div></button>').join("");
  const pc = p.c || "#ffd166";
  $("pane").innerHTML = '<div class="grab"></div><div class="phead" style="--pc:' + esc(pc) + '">' + (art ? '<div class="pbg" style="background-image:url(\'' + art + '\')"></div><img class="part0" src="' + esc(art) + '" alt="">' : "") +
    '<button class="x" id="x" aria-label="Закрыть">✕</button></div>' +
    '<div class="pb" style="text-align:center"><h2 class="ph2">' + esc(p.name || p.en) + '</h2>' + (p.en && p.name && p.en !== p.name ? '<div class="pen">' + esc(p.en) + '</div>' : "") +
    (on && rub(p) ? '<div class="pprice" style="--pc:' + esc(pc) + '">' + esc(rub(p)) + '</div>' : '<div class="tags" style="justify-content:center"><span class="tag">Сейчас не продаётся</span></div>') +
    (p.note ? '<p class="desc" style="margin-top:12px">' + esc(p.note) + '</p>' : "") +
    (parts ? '<div class="lbl" style="text-align:left">Что внутри · ' + packItems(p).length + '</div><div class="parts">' + parts + '</div>' : "") +
    '<button class="btn g" id="buy">' + (on ? "Купить в " + esc(BUY_NAME) : "Заказать через " + esc(BUY_NAME)) + '</button>' +
    '<p class="desc" style="color:var(--mut);font-size:12.5px">' + (on ? "Цена в " + esc(BUY_NAME) + ", у них же оформляется покупка." : "В " + esc(BUY_NAME) + " можно заказать набор, даже если его нет в ассортименте — напиши им в поддержку.") + '</p></div>';
  $("sheet").classList.add("on"); $("sheet").setAttribute("aria-hidden", "false"); $("pane").scrollTop = 0;
  $("x").onclick = close; $("buy").onclick = openBuy;
  if (inTg && tg.BackButton) { tg.BackButton.show(); tg.BackButton.onClick(close); }
}
function openById(id) {
  if (!id) return;
  const s = shop.find(i => i.id === id) || ownShop.get(id);
  if (s) return openItem(fromShop(s));
  const c = catalog && catalog.find(x => x.id.toLowerCase() === id.toLowerCase());
  if (c) return openItem(fromCat(c));
  loadCatalog().then(() => { const c2 = catalog && catalog.find(x => x.id.toLowerCase() === id.toLowerCase()); if (c2) openItem(fromCat(c2)); });
}

// ---------- стили, набор предметов и платный набор для карточки предмета
const stCache = {};
function loadExtras(it, key) {
  const my = vidToken;
  // стили (варианты) — через наш воркер, картинки тоже через него
  (stCache[key] ? Promise.resolve(stCache[key]) : fetch(API + "/api/styles?id=" + encodeURIComponent(key)).then(r => r.json()).then(d => (stCache[key] = d.styles || [])).catch(() => []))
    .then(st => {
      if (my !== vidToken || !st.length || !$("sty")) return;
      $("sty").innerHTML = st.map((g, gi) => '<div class="stg"><div class="stl" id="stl' + gi + '">' + esc((g.ch || "Стиль").toUpperCase()) + ' · ' + esc(g.o[0].n) + '</div><div class="sts">' +
        g.o.map((o, oi) => '<button class="st' + (oi ? "" : " on") + '" data-g="' + gi + '" data-o="' + oi + '" title="' + esc(o.n) + '"><img loading="lazy" src="' + esc(o.i) + '" alt=""></button>').join("") + '</div></div>').join("");
      $("sty").onclick = e => {
        const b = e.target.closest(".st"); if (!b) return;
        const g = +b.dataset.g, o = +b.dataset.o, opt = st[g].o[o];
        $("sty").querySelectorAll('.st[data-g="' + g + '"]').forEach(x => x.classList.toggle("on", x === b));
        $("stl" + g).textContent = (st[g].ch || "Стиль").toUpperCase() + " · " + opt.n;
        const big = $("pane").querySelector(".big"), img = big.querySelector("img"), v = big.querySelector("video");
        haptic("sel");
        let ov = big.querySelector(".stov");
        const base = [...$("sty").querySelectorAll(".st.on")].every(x => x.dataset.o === "0");
        if (v && big.classList.contains("vid")) {
          // видео есть только для основного стиля: оно крутится дальше, выбранный стиль — карточкой в углу
          if (base) { if (ov) ov.remove(); return; }
          if (!ov) { big.insertAdjacentHTML("beforeend", '<div class="stov"><img alt=""><span></span></div>'); ov = big.querySelector(".stov"); }
          ov.querySelector("img").src = opt.i; ov.querySelector("span").textContent = opt.n;
          return;
        }
        if (img) img.src = base ? it.img : opt.i; else big.insertAdjacentHTML("afterbegin", '<img src="' + esc(opt.i) + '" alt="">');
      };
    });
  // предметы из того же набора (сета) и платный набор, где он есть
  Promise.all([loadCatalog(), ensurePacks()]).then(() => {
    if (my !== vidToken || !$("ext")) return;
    let html = "";
    if (it.set && catalog) {
      const same = catalog.filter(c => c.s === it.set && c.id.toLowerCase() !== key.toLowerCase()).slice(0, 12);
      if (same.length) html += '<div class="lbl">' + esc(it.set.replace(/\.$/, "")) + '</div><div class="parts">' +
        same.map(c => '<button class="part" data-id="' + esc(c.id) + '" style="--c1:' + c.c1 + ';--c2:' + c.c2 + '"><img loading="lazy" src="' + esc(c.i) + '" alt=""><div>' + esc(c.n) + '</div></button>').join("") + '</div>';
    }
    const inPacks = (packs || []).filter(p => packItems(p).some(x => (x.id || "").toLowerCase() === key.toLowerCase()));
    if (inPacks.length) html += '<div class="lbl">Есть в наборе</div>' + inPacks.map(p => '<button class="prow in" data-p="' + packs.indexOf(p) + '"' + (p.c ? ' style="--pc:' + esc(p.c) + '"' : "") + '><img loading="lazy" src="' + esc(packArt(p)) + '" alt=""><span class="pr-t"><b>' + esc(p.name || p.en) + '</b><em>' + (p.active !== false ? esc(rub(p)) : "сейчас не продаётся") + '</em></span></button>').join("");
    $("ext").innerHTML = html;
  });
}
$("pane").addEventListener("click", e => {
  const sb = e.target.closest(".prow[data-sid]");
  if (sb) { const b = shop.find(i => i.id === sb.dataset.sid); if (b) { vidToken++; const v = $("pane").querySelector("video"); if (v) { v.pause(); v.remove(); } openItem(fromShop(b)); } return; }
  const pr = e.target.closest(".prow[data-p]"); if (pr) { vidToken++; const v = $("pane").querySelector("video"); if (v) v.pause(); openPack(packs[+pr.dataset.p]); return; }
  const pt = e.target.closest(".part[data-id]"); if (pt && pt.dataset.id) { vidToken++; const v = $("pane").querySelector("video"); if (v) { v.pause(); v.remove(); } haptic("sel"); openById(pt.dataset.id); }
});

// ---------- карточка предмета
function openItem(it) {
  const s = it.price != null ? it : (ownShop.get(it.id) || ownShop.get(it.keys[0]) || null);
  const inB = !s ? (inShop.get(it.id) || inShop.get(it.keys[0])) : null;   // сам не продаётся, но есть в наборе в магазине
  const key = it.keys[0];
  const rb = it.rb || it.c1;
  const last = s ? s.lastSeen : it.lastSeen, times = (s ? s.times : it.times) || 0;
  const rows = [];
  if (s) {
    rows.push([IC.coin, "Цена", s.price + " В-баксов"]);
    if (s.regular > s.price) rows.push([IC.gem, "Выгода", "−" + Math.round((1 - s.price / s.regular) * 100) + "% · по отдельности " + s.regular]);
    if (s.out) rows.push([IC.clock, "В магазине до", fmt(Date.parse(s.out), true)]);
  }
  rows.push([IC.back, "Последний раз", s && s.isNew ? "впервые сегодня" : s && s.days === 1 ? "вчера" : last ? fmt(dayOf(last), true) + (s && s.days ? " · " + s.days + " " + plural(s.days, "день", "дня", "дней") + " назад" : "") : "не продавался"]);
  rows.push([IC.repeat, "Был в магазине", times ? times + " " + plural(times, "раз", "раза", "раз") : "ни разу"]);
  if (it.firstSeen || (s && s.firstSeen)) rows.push([IC.star, "Впервые в магазине", fmt(dayOf(it.firstSeen || s.firstSeen), true)]);
  if (it.intro) rows.push([IC.gem, "Появился в игре", it.intro]);
  const srcs = (it.src && it.src.length ? it.src : (times ? ["Магазин"] : []));
  const tags = [it.rarity ? '<span class="tag rar">' + esc(it.rarity) + '</span>' : "", it.typeName ? '<span class="tag">' + esc(it.typeName) + '</span>' : "", it.set ? '<button class="tag tg-l" id="settag">' + esc(it.set) + ' ›</button>' : ""].join("");
  curSound = it.kind === "emote" || it.kind === "music";
  const on = () => !!fav[key];
  $("pane").innerHTML =
    '<div class="grab"></div><div class="big" style="--c1:' + it.c1 + ';--c2:' + it.c2 + ';--b:' + rb + '">' + (it.img ? '<img src="' + esc(it.img) + '" alt="">' : "") +
    '<button class="x" id="x" aria-label="Закрыть">✕</button></div>' +
    '<div class="vbar" id="vbar"><button id="mute" aria-label="Звук">' + SND_ON + '</button><input id="vr" type="range" min="0" max="100" step="5" aria-label="Громкость"><span id="vv"></span></div>' +
    '<a class="src" id="src" hidden target="_blank" rel="noopener">видео: fortnite.gg</a><div class="sty" id="sty" style="--b:' + rb + '"></div>' +
    '<div class="pb" style="--b:' + rb + '"><h2>' + esc(it.name) + '</h2><div class="tags">' + tags + '</div>' +
    (it.desc ? '<p class="desc">' + esc(it.desc) + '</p>' : "") +
    (srcs.length ? '<div class="lbl">Где получить</div><div class="srcs">' + srcs.map(x => '<span class="sc"><i></i>' + esc(x) + '</span>').join("") + '</div>' : "") +
    '<div class="rows">' + rows.map(([ic, a, b]) => '<div class="row">' + ic + '<span>' + a + '</span><b>' + esc(b) + '</b></div>').join("") + '</div>' +
    (it.parts && it.parts.length ? '<div class="lbl">В наборе</div><div class="parts">' + it.parts.map(p => '<div class="part">' + (p.img ? '<img loading="lazy" src="' + esc(p.img) + '" alt="">' : "") + '<div>' + esc(p.name) + '</div></div>').join("") + '</div>' : "") +
    (inB ? '<div class="lbl">Сейчас в магазине в наборе</div><button class="prow in" data-sid="' + esc(inB.id) + '"><img loading="lazy" src="' + esc(inB.img) + '" alt=""><span class="pr-t"><b>' + esc(inB.name) + '</b><em>' + inB.price + ' В-баксов</em></span></button>' : "") +
    '<div id="ext"></div><button class="btn p" id="w"></button><button class="btn s" id="share">Поделиться с другом</button></div>';
  const paint = () => { const b = $("w"); b.className = "btn " + (on() ? "hon" : "h"); b.innerHTML = IC.heart + (on() ? "В избранном" : (s ? "Добавить в избранное" : "Сообщить, когда появится")); };
  paint();
  $("sheet").classList.add("on"); $("sheet").setAttribute("aria-hidden", "false");
  $("pane").scrollTop = 0;
  $("x").onclick = close;
  $("w").onclick = () => {
    toggleFav(it, s, last); paint();
  };
  $("share").onclick = () => {
    const text = s ? it.name + " сейчас в магазине Fortnite за " + s.price + " В-баксов" + (s.out ? ", до " + fmt(Date.parse(s.out)) : "")
                   : it.name + " — узнай первым, когда появится в магазине Fortnite";
    const url = "https://t.me/share/url?url=" + encodeURIComponent("https://t.me/stwradar") + "&text=" + encodeURIComponent(text);
    if (inTg && tg.openTelegramLink) tg.openTelegramLink(url); else window.open(url, "_blank");
  };
  if (inTg && tg.BackButton) { tg.BackButton.show(); tg.BackButton.onClick(close); }
  if ($("settag")) $("settag").onclick = () => { const x = $("ext"); if (x && x.firstChild) x.scrollIntoView({ behavior: "smooth", block: "start" }); };
  loadVideo(key);
  loadExtras(it, key);
}

// ---------- видео предмета (fortnite.gg, с их водяным знаком)
let vol = 50, vidToken = 0, curSound = false;
const SND_ON = '<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4zM16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/></svg>';
const SND_OFF = '<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4zM17 9l5 6M22 9l-5 6"/></svg>';
try { const v = localStorage.getItem("stw_vol"); if (v !== null) vol = +v; } catch (e) {}
const vidCache = {};
let ggMap = null;
const ggReady = () => ggMap ? Promise.resolve(ggMap) : fetch("data/videos.json").then(r => r.json()).then(d => (ggMap = d || {})).catch(() => (ggMap = {}));
function loadVideo(id) {
  const my = ++vidToken;
  ggReady().then(() => loadVideo2(id, my));
}
function loadVideo2(id, my) {
  const n = ggMap[id];
  const viaMap = n ? { video: ["https://fnggcdn.com/items/" + n + "/video.mp4?1", "https://fnggcdn.com/items/" + n + "/video-sd.mp4"], source: "https://fortnite.gg/cosmetics?id=" + n } : null;
  const get = Promise.resolve(viaMap);
  get.then(d => {
    if (my !== vidToken || !d || !d.video || !$("sheet").classList.contains("on")) return;
    const big = $("pane").querySelector(".big"); if (!big) return;
    const v = document.createElement("video");
    v.referrerPolicy = "no-referrer"; v.setAttribute("referrerpolicy", "no-referrer");
    v.playsInline = true; v.loop = true; v.preload = "auto"; v.setAttribute("playsinline", ""); v.setAttribute("webkit-playsinline", "");
    let i = 0;
    v.src = d.video[0];
    v.onerror = () => { if (++i < d.video.length) v.src = d.video[i]; else v.remove(); };
    v.onloadeddata = () => {
      big.classList.add("vid"); if (curSound) $("vbar").classList.add("on");
      if (d.source) { $("src").href = d.source; $("src").hidden = false; }
    };
    v.onclick = () => v.paused ? v.play() : v.pause();
    big.insertBefore(v, big.querySelector(".x"));
    if (!curSound) { v.muted = true; v.play().catch(() => {}); return; }   // осмотр скина/кирки и т.п. — без звука
    setVolUI();
    v.volume = vol / 100; v.muted = vol === 0;
    v.play().catch(() => { v.muted = true; setVolUI(true); v.play().catch(() => {}); });
    $("vr").oninput = e => { vol = +e.target.value; try { localStorage.setItem("stw_vol", vol); } catch (er) {} v.volume = vol / 100; v.muted = vol === 0; if (v.paused) v.play().catch(() => {}); setVolUI(); };
    $("mute").onclick = () => { if (v.muted || vol === 0) { if (!vol) vol = 50; v.muted = false; v.volume = vol / 100; v.play().catch(() => {}); } else v.muted = true; setVolUI(v.muted); };
  });
}
function setVolUI(muted) {
  if (!$("vr")) return;
  $("vr").value = muted ? 0 : vol; $("vv").textContent = (muted ? 0 : vol) + "%"; $("mute").innerHTML = muted || !vol ? SND_OFF : SND_ON;
}
function close() {
  vidToken++;
  const v = $("pane").querySelector("video"); if (v) { v.pause(); v.removeAttribute("src"); v.load(); v.remove(); }
  $("sheet").classList.remove("on"); $("sheet").setAttribute("aria-hidden", "true");
  if (inTg && tg.BackButton) { tg.BackButton.hide(); tg.BackButton.offClick(close); }
}
let tt;
function toast(t) { const el = $("toast"); el.textContent = t; el.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => el.classList.remove("on"), 2300); }

function toggleFav(it, s, last) {
  const key = it.keys[0];
  if (fav[key]) { delete fav[key]; toast("Убрано из избранного"); haptic("warning"); }
  else {
    fav[key] = { id: key, key, name: it.name, img: it.thumb || it.img, last, c1: it.c1, c2: it.c2 };
    askWrite(); haptic("success");
    toast(s ? "❤ В избранном — он уже в магазине" : "❤ Напишем, когда «" + it.name + "» появится");
  }
  saveFav(); render();
}
function itemById(id) {
  const s = shop.find(i => i.id === id) || ownShop.get(id);
  if (s) return fromShop(s);
  const c = catalog && catalog.find(x => x.id === id);
  if (c) return fromCat(c);
  const f = fav[id];
  return f ? { id, keys: [id], name: f.name, thumb: f.img, img: f.img, lastSeen: f.last, c1: f.c1 || "#22456a", c2: f.c2 || "#11243b" } : null;
}

// ---------- события
$("shade").onclick = close;
document.addEventListener("keydown", e => { if (e.key === "Escape") close(); });
let qT;
$("q").addEventListener("input", e => { clearTimeout(qT); qT = setTimeout(() => { query = e.target.value; shown = PAGE; render(); }, 120); });
{
  const c = $("chips");
  c.addEventListener("wheel", e => { if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { c.scrollLeft += e.deltaY; e.preventDefault(); } }, { passive: false });
  let down = false, sx = 0, sl = 0, moved = false;
  c.addEventListener("pointerdown", e => { if (e.pointerType !== "mouse") return; down = true; moved = false; sx = e.clientX; sl = c.scrollLeft; });
  window.addEventListener("pointermove", e => { if (!down) return; const dx = e.clientX - sx; if (Math.abs(dx) > 4) { moved = true; c.classList.add("drag"); } c.scrollLeft = sl - dx; });
  window.addEventListener("pointerup", () => { if (!down) return; down = false; setTimeout(() => c.classList.remove("drag"), 0); });
  c.addEventListener("click", e => { if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; } }, true);
}
$("chips").addEventListener("click", e => { const b = e.target.closest(".chip"); if (!b) return; cat = b.dataset.c; shown = PAGE; haptic("sel"); chips(); render(); });
$("list").addEventListener("click", e => {
  const pk = e.target.closest(".prow,.pkl");
  if (pk) { openPack(packs[+pk.dataset.p]); return; }
  const b = e.target.closest(".it"); if (!b) return;
  const id = b.dataset.id;
  if (e.target.closest(".hrt")) {
    e.stopPropagation();
    const it = itemById(id); if (!it) return;
    const s = (it.price ? it : null) || ownShop.get(it.keys[0]) || null;
    toggleFav(it, s, s ? s.lastSeen : it.lastSeen);
    const h = $("list").querySelector('.it[data-id="' + CSS.escape(id) + '"] .hrt'); if (h) h.classList.add("pop");
    return;
  }
  const s = shop.find(i => i.id === id) || ownShop.get(id);
  if (s) return openItem(fromShop(s));
  const c = catalog && catalog.find(x => x.id === id);
  if (c) return openItem(fromCat(c));
  loadCatalog().then(() => { const c2 = catalog && catalog.find(x => x.id === id); if (c2) openItem(fromCat(c2)); });
});
function loadCatalog() {
  if (catalog) return Promise.resolve();
  if (catLoading) return catLoading;
  catLoading = fetch("data/catalog.json").then(r => r.json()).then(d => { catalog = d; if (view === "all" || view === "packs") { chips(); render(); } })
    .catch(() => { catLoading = false; toast("Не удалось загрузить каталог"); });
  return catLoading;
}
function setView(v) {
  if (v === view) return;
  view = v; cat = "all"; query = ""; shown = PAGE; $("q").value = "";
  $("q").placeholder = v === "all" ? "Найти любой предмет" : "Найти в магазине";
  ["tShop", "tAll", "tPacks", "tMine"].forEach((id, i) => $(id).classList.toggle("on", ["shop", "all", "packs", "mine"][i] === v));
  if (v === "all" || v === "packs") loadCatalog();
  if (v === "packs" && !packs) ensurePacks().then(() => { if (view === "packs") render(); });
  haptic("sel"); chips(); render(); window.scrollTo({ top: 0 });
}
$("tShop").onclick = () => setView("shop");
$("tAll").onclick = () => setView("all");
$("tPacks").onclick = () => setView("packs");
$("tMine").onclick = () => setView("mine");

$("list").innerHTML = '<div class="grid">' + '<div class="sk"></div>'.repeat(8) + '</div>';
fetch("data/shop.json").then(r => r.json()).then(d => {
  vbIcon = d.vbuck || ""; today = dayOf(d.date);
  shop = d.items.slice().sort((a, b) => (a.order - b.order));
  // для каталога: если предмет продаётся и отдельно, и в наборе — показываем отдельную (обычно дешевле) позицию
  // позиция «сам по себе» — только для своего главного предмета (у скина со встроенной эмоцией эмоция не считается)
  shop.forEach(it => { if (it.kind !== "bundle" && it.keys[0]) { const o = ownShop.get(it.keys[0]); if (!o || it.price < o.price) ownShop.set(it.keys[0], it); } });
  ownShop.forEach((it, k) => inShop.set(k, it));
  shop.forEach(it => { if (it.kind === "bundle") it.keys.forEach(k => { const o = inShop.get(k); if (!o || (o.kind === "bundle" && it.price < o.price)) inShop.set(k, it); }); });
  $("date").textContent = fmt(today, true) + " · " + shop.length + " " + plural(shop.length, "предмет", "предмета", "предметов");
  chips(); render();
  setTimeout(loadCatalog, 1500);   // каталог подгружаем заранее, чтобы вкладка открывалась сразу
}).catch(() => {
  $("date").textContent = "не удалось загрузить";
  $("list").innerHTML = ""; const e = $("empty"); e.hidden = false; e.innerHTML = "<b>Магазин не загрузился</b>Проверь интернет и открой ещё раз.";
});
}
